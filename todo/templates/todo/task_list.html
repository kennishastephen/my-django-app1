<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>Today's Tasks</h1>
    <p>Total: {{ total }} | Completed: {{ completed }} | Not Completed: {{ not_completed }}</p>
    <ul>
        {% for task in tasks %}
            <li>
                {% if task.completed %}✅{% else %}❌{% endif %} {{ task.title }}
            </li>
        {% empty %}
            <li>No tasks for today.</li>
        {% endfor %}
    </ul>
</body>
</html>
